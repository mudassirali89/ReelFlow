<div class="card mb-4">
  <div class="d-flex align-items-center justify-content-between px-4 py-3 rounded-top"
         style="background: linear-gradient(to right, #2563eb, #1e3a8a);">
     <h5 class="mb-0 text-white fw-bold">Search Movies</h5>
     <button type="button" class="btn-close btn-close-black" (click)="onClose()"></button>
  </div>
  <div class="card-body">
    <form (ngSubmit)="onSearchClick()">
      <div class="row g-3">
        <div class="col-md-4">
          <input type="text" class="form-control" placeholder="Title"
                 [(ngModel)]="title" (input)="onValueChange($event)"name="title">
        </div>
        <div class="col-md-4">
          <input type="text" class="form-control" placeholder="Description"
                 [(ngModel)]="description" (input)="onValueChange($event)" name="description">
        </div>
        <div class="col-md-4">
          <input type="date" class="form-control"
                 [(ngModel)]="releaseDate" (input)="onValueChange($event)" name="releaseDate">
        </div>
      </div>
      <div class="mt-3">
        <button type="submit" class="btn btn-primary me-2">
          <i class="bi bi-search"></i> Search
        </button>
        <button type="button" class="btn btn-secondary" (click)="onResetClick()">
          Reset
        </button>
      </div>
    </form>
  </div>
</div>
